applications:
  - name: insurance-quote-spring-mvc-demo
    memory: 1G
    instances: 1
    buildpacks:
      - java_buildpack_offline
    path: target\insurance-quote-spring-mvc-demo.jar
    env:
      JBP_CONFIG_OPEN_JDK_JRE: '{jre: {version: 21.+}}'
    health-check-type: port
    disk-quota: 1G
